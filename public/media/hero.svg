<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F78B8" />
      <stop offset="32%" stop-color="#9BA0D4" />
      <stop offset="62%" stop-color="#D8B4D4" />
      <stop offset="85%" stop-color="#F0C6C2" />
      <stop offset="100%" stop-color="#DFC5CB" />
    </linearGradient>
    <radialGradient id="pinkHorizon" cx="55%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#FAD4C8" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#E2B4CE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8A92C9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="zenithIndigo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4B5294" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#6F78B8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#duskSky)" />
  <rect width="1600" height="1000" fill="url(#pinkHorizon)" />
  <rect width="1600" height="1000" fill="url(#zenithIndigo)" />
  <!-- Soft dusk clouds -->
  <ellipse cx="320" cy="240" rx="280" ry="36" fill="#F6D8DC" opacity="0.22" />
  <ellipse cx="1220" cy="190" rx="340" ry="42" fill="#F6D8DC" opacity="0.18" />
  <ellipse cx="820" cy="310" rx="440" ry="48" fill="#FCE2DF" opacity="0.2" />
</svg>
